config:
  envoyGateway:
    # Enable the Backend extension API (gateway.envoyproxy.io/v1alpha1) used by
    # the gw chart's HTTP CONNECT forward proxy (type: DynamicResolver).
    extensionApis:
      enableBackend: true
      # Enable EnvoyPatchPolicy (used by the gw chart to remap the forward
      # proxy's basic-auth 401 to 405 via HCM local_reply_config).
      enableEnvoyPatchPolicy: true

service:
  annotations:
    oci.oraclecloud.com/load-balancer-type: "nlb"
    oci-network-load-balancer.oraclecloud.com/is-preserve-source: "true"
  spec:
    externalTrafficPolicy: Local
    healthCheckNodePort: 30122
    ipFamilyPolicy: PreferDualStack
    ipFamilies:
      - IPv4
      - IPv6

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi
