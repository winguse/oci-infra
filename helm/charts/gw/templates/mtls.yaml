---
apiVersion: v1
kind: Secret
metadata:
  name: mtls-ca-bundle
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  tls.ca: {{ printf "%s\n%s" (.Files.Get "certs/mtlsca.crt") (.Files.Get "certs/mtlsca-095.crt") | b64enc | quote }}
