apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-mtls
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
  tls:
    clientValidation:
      optional: true
      caCertificateRefs:
        - name: mtls-ca-bundle
---
apiVersion: v1
kind: Secret
metadata:
  name: mtls-ca-bundle
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  tls.ca: {{ printf "%s\n%s" (.Files.Get "certs/mtlsca.crt") (.Files.Get "certs/mtlsca-095.crt") | b64enc | quote }}
