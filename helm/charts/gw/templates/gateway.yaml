apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-config
  namespace: {{ .Release.Namespace }}
spec:
  ipFamily: DualStack
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          oci.oraclecloud.com/load-balancer-type: "nlb"
          oci-network-load-balancer.oraclecloud.com/is-private: "false"
          oci-network-load-balancer.oraclecloud.com/is-preserve-source: "true"
        patch:
          type: StrategicMerge
          value:
            spec:
              ipFamilyPolicy: PreferDualStack
              ipFamilies:
                - IPv4
                - IPv6
              healthCheckNodePort: 30122
              ports:
                - name: http
                  port: 80
                  protocol: TCP
                  nodePort: 31080
                - name: https-mtls-a
                  port: 443
                  protocol: TCP
                  nodePort: 31332
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-config
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-mtls-a
      protocol: HTTPS
      port: 443
      hostname: "a.i.wingu.se"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.commonSecretName | default "common-tls" | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- if .Values.tls.coderSecretName }}
          - group: ""
            kind: Secret
            name: {{ .Values.tls.coderSecretName | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- end }}
    - name: https-mtls-hm
      protocol: HTTPS
      port: 443
      hostname: "hm.i.wingu.se"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.commonSecretName | default "common-tls" | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- if .Values.tls.coderSecretName }}
          - group: ""
            kind: Secret
            name: {{ .Values.tls.coderSecretName | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- end }}
    - name: https-mtls-hmc
      protocol: HTTPS
      port: 443
      hostname: "hmc.i.wingu.se"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.commonSecretName | default "common-tls" | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- if .Values.tls.coderSecretName }}
          - group: ""
            kind: Secret
            name: {{ .Values.tls.coderSecretName | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- end }}
    - name: https-mtls-omni
      protocol: HTTPS
      port: 443
      hostname: "omni.i.wingu.se"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.commonSecretName | default "common-tls" | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- if .Values.tls.coderSecretName }}
          - group: ""
            kind: Secret
            name: {{ .Values.tls.coderSecretName | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- end }}
    - name: https-mtls-oc
      protocol: HTTPS
      port: 443
      hostname: "oc.i.wingu.se"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.commonSecretName | default "common-tls" | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- if .Values.tls.coderSecretName }}
          - group: ""
            kind: Secret
            name: {{ .Values.tls.coderSecretName | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- end }}
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.commonSecretName | default "common-tls" | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- if .Values.tls.coderSecretName }}
          - group: ""
            kind: Secret
            name: {{ .Values.tls.coderSecretName | quote }}
            namespace: {{ .Release.Namespace | quote }}
          {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-https-http3
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
      sectionName: https
  http3: {}
