{{- if and .Values.tls .Values.tls.coderWildcardDomain -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tls.coderSecretName | default "coder-tls" }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.tls.coderSecretName | default "coder-tls" }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.tls.coderWildcardDomain | quote }}
{{- end }}
