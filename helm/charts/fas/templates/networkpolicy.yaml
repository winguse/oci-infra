{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fas.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fas.selectorLabels" . | nindent 8 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress ONLY from Envoy / Traefik
    {{- range .Values.networkPolicy.ingressFrom }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
    # Allow local pod-to-pod/internal namespace communication
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
