replicaCount: 1

image:
  registry: ghcr.io
  repository: winguse/fas
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "traefik"
  domain: a.i.wingu.se
  annotations: {}

tls:
  commonSecretName: "common-tls"

mtls:
  enabled: true

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: "micro-nfs"
  mountPath: /data

env:
  FAS_PORT: "8080"
  FAS_DATA_FILE: "/data/fas.jsonl"
  FAS_ACL_FILE: "/data/acl.yaml"

# When set, creates a Kubernetes Secret and header injection configuration that
# injects the X-Shared-Secret header into every request Envoy forwards to FAS.
# FAS_SHARED_SECRET is also exposed to the FAS container for request validation.
sharedSecret: ""

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceLabels:
        kubernetes.io/metadata.name: kube-system
      podLabels:
        app.kubernetes.io/name: envoy
    - namespaceLabels:
        kubernetes.io/metadata.name: kube-system
      podLabels:
        app.kubernetes.io/name: traefik
