{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omniroute.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniroute.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omniroute.selectorLabels" . | nindent 8 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow any traffic to API and WebSocket ports from inside the cluster
    - ports:
        - protocol: TCP
          port: {{ .Values.service.apiPort }}
        - protocol: TCP
          port: {{ .Values.service.liveWsPort }}
    # Allow dashboard port ONLY from Traefik
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.dashboardPort }}
    # Allow local pod-to-pod/internal namespace communication on dashboard port
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.dashboardPort }}
{{- end }}
