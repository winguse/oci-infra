{{- if .Values.ingress.enabled -}}
{{- $fullName := include "omniroute.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniroute.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: envoy
      namespace: gw
  hostnames:
    - {{ .Values.ingress.dashboardHost | quote }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.dashboardPort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniroute.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: envoy
      namespace: gw
  hostnames:
    - {{ .Values.ingress.apiHost | quote }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.apiPort }}
{{- end }}
