{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "h2o.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "h2o.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "h2o.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
        - protocol: UDP
          port: 8443
  egress:
    - {}
{{- end }}
