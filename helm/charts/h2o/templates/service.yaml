apiVersion: v1
kind: Service
metadata:
  name: {{ include "h2o.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "h2o.labels" . | nindent 4 }}
  {{- if .Values.service.annotations }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  {{- end }}
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
      nodePort: 32090
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https
      nodePort: 32490
    - port: 443
      targetPort: 8443
      protocol: UDP
      name: https-quic
      nodePort: 32491
  selector:
    {{- include "h2o.selectorLabels" . | nindent 4 }}
