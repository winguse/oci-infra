apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: envoy
      namespace: gw
      sectionName: https
  hostnames:
    - {{ .Values.coderDomain | quote }}
    - {{ .Values.tls.coderWildcardDomain | quote }}
    {{- if .Values.cloudflare.coderDomain }}
    - {{ .Values.cloudflare.coderDomain | quote }}
    {{- end }}
    {{- if .Values.cloudflare.coderWildcardDomain }}
    - {{ .Values.cloudflare.coderWildcardDomain | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: coder
          port: 80
