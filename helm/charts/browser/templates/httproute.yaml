{{- if .Values.ingress.enabled -}}
{{- $fullName := include "browser.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "browser.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: envoy
      namespace: gw
      sectionName: https
    - name: envoy-quic
      namespace: gw
      sectionName: https
  hostnames:
    - {{ .Values.ingress.domain | quote }}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: alt-svc
                value: 'h3=":443"; ma=86400'
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port | default 8080 }}
{{- end }}
