{{- if .Values.ingress.enabled -}}
{{- $fullName := include "browser.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "browser.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: envoy
      namespace: gw
  hostnames:
    - {{ .Values.ingress.domain | quote }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port | default 8080 }}
{{- end }}
