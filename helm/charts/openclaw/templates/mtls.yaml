{{- if .Values.mtls.enabled -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "openclaw.fullname" . }}-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.mtls.gatewayName | default "envoy" }}
  tls:
    clientValidation:
      caCertificateRefs:
        - name: {{ include "openclaw.fullname" . }}-mtls-ca
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openclaw.fullname" . }}-mtls-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
type: Opaque
data:
  tls.ca: {{ printf "%s\n%s" (.Files.Get "certs/mtlsca.crt") (.Files.Get "certs/mtlsca-095.crt") | b64enc | quote }}
{{- end }}
